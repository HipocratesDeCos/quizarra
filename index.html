<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperQuiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            color: white;
        }
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            color: white;
        }
        .page {
            display: none;
            flex: 1;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }
        .main-menu {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            flex: 1;
            text-align: center;
        }
        .main-buttons {
            display: grid;
            gap: 20px;
            margin-top: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 15px;
            padding: 20px 25px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            height: auto;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }
        .btn:hover {
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.6);
            transform: translateY(-2px);
        }
        .quiz-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            flex: 1;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .quiz-title {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .progress {
            font-size: 1.1rem;
            color: #666;
        }
        .instructions {
            background: linear-gradient(135deg, #a8e6cf 0%, #dcedc8 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border-left: 4px solid #4caf50;
        }
        .instructions p {
            margin: 0;
            font-weight: 500;
            color: #2e7d32;
        }
        .question {
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 1px solid #eee;
        }
        .question:last-child {
            border-bottom: none;
        }
        .question-intro {
            background: #f8f9fa;
            border-left: 4px solid #4facfe;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
        }
        .question-intro p {
            margin: 0;
            color: #555;
            font-style: italic;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .options {
            display: grid;
            gap: 12px;
        }
        .option {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .option:hover {
            background: #eef2f7;
        }
        .option.selected {
            background: linear-gradient(135deg, #d4e5ff 0%, #c1d7ff 100%);
            border: 2px solid #4facfe;
            font-weight: 500;
        }
        .option.correct {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
        }
        .option.incorrect {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border: 2px solid #dc3545;
        }
        .question-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        .btn-validate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-validate:hover {
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }
        .btn-validate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-saber-mas {
            color: #667eea;
            text-decoration: underline;
            background: none;
            border: none;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            margin: 0 10px;
        }
        .btn-saber-mas:hover {
            color: #555;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            font-size: 1rem;
            line-height: 1.7;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            background: none;
            border: none;
        }
        .modal-close:hover {
            color: #000;
        }
        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .modal-content p {
            margin-bottom: 15px;
            text-align: justify;
        }
        .modal-content u {
            text-decoration: none;
            border-bottom: 1px dotted #007bff;
            cursor: help;
        }
        .feedback {
            padding: 15px 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 500;
        }
        .feedback.correct {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
            color: #155724;
        }
        .feedback.incorrect {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border: 2px solid #dc3545;
            color: #721c24;
        }
        .results {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            border-radius: 15px;
            margin: 20px 0;
        }
        .results h3 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        .results .score {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        .results .message {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
        }
        .btn-home {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            padding: 10px 20px;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-home:hover {
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .loading::after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        .error {
            background: #fff8f8;
            border: 1px solid #ffcccc;
            border-radius: 10px;
            padding: 20px;
            color: #cc0000;
            margin: 20px 0;
        }
        .error h3 {
            margin-top: 0;
            color: #cc0000;
        }
        .error code {
            background: #f0f0f0;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
        }
        .error ul {
            padding-left: 20px;
            margin: 10px 0;
        }
        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 0.8rem;
            color: #666;
            white-space: pre-wrap;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            .header h1 {
                font-size: 2rem;
            }
            .quiz-container, .quiz-menu, .main-menu {
                padding: 20px;
            }
            .quiz-container {
                max-width: 90%;
            }
            .question-text {
                font-size: 1.1rem;
            }
            .btn {
                padding: 15px 20px;
                font-size: 1rem;
            }
            .quiz-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .results h3 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Página principal -->
        <div class="container page active" id="main-page">
            <div class="header">
                <h1>SuperQuiz</h1>
                <p>Plataforma de aprendizaje interactivo</p>
            </div>
            <div class="main-menu">
                <h2>Selecciona un área</h2>
                <div class="main-buttons">
                    <button class="btn" onclick="showPage('menu-page', 'contabilidad')">CONTABILIDAD</button>
                    <button class="btn" onclick="showPage('menu-page', 'analisis-economico-financiero')">ANÁLISIS ECONÓMICO-FINANCIERO</button>
                    <button class="btn" onclick="showPage('menu-page', 'economia')">ECONOMÍA</button>
                    <button class="btn" onclick="showPage('menu-page', 'marketing')">MARKETING</button>
                </div>
            </div>
        </div>

        <!-- Menú de temas -->
        <div class="page" id="menu-page">
            <div class="main-menu">
                <h2 id="area-title">Temas disponibles</h2>
                <div id="quiz-list" class="main-buttons">
                    <!-- Los temas se cargarán dinámicamente aquí -->
                </div>
                <button class="btn btn-home" onclick="showPage('main-page')">← Volver al inicio</button>
            </div>
        </div>

        <!-- Página del quiz -->
        <div class="page" id="quiz-page">
            <div class="quiz-container">
                <div class="quiz-header">
                    <h2 class="quiz-title" id="quiz-title">Título del tema</h2>
                    <div class="progress">Pregunta <span id="current-question">1</span> de <span id="total-questions">15</span></div>
                </div>
                
                <div class="instructions">
                    <p>Selecciona una o varias opciones y haz clic en "Validar respuesta" para comprobar si es correcta.</p>
                </div>
                
                <div id="quiz-content">
                    <!-- El contenido del quiz se cargará dinámicamente aquí -->
                </div>
            </div>
        </div>

        <!-- Página de resultados -->
        <div class="page" id="results-page">
            <div class="results">
                <h3>¡Quiz completado!</h3>
                <div class="score" id="final-score">0/0</div>
                <div class="message" id="result-message">¡Buen trabajo!</div>
                <button class="btn-home" onclick="showPage('menu-page')">Volver a los temas</button>
            </div>
        </div>
    </div>

    <!-- Modal para "Saber más" -->
    <div id="saberMasModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3 class="modal-title">Más información</h3>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        // Variables globales
        let currentArea = 'contabilidad';
        let currentQuizId = '';
        let currentQuestionIndex = 0;
        let selectedOptions = [];
        let score = 0;
        let quizData = null;
        let totalQuestions = 0;

        // Función para obtener la ruta base de la aplicación
        function getBasePath() {
            const path = window.location.pathname;
            // Si estamos en GitHub Pages con un repositorio específico
            if (path.includes('/quizarra')) {
                const segments = path.split('/');
                if (segments.length > 1) {
                    return '/' + segments[1];
                }
            }
            return '';
        }

        // Función para mostrar información de debug
        function showDebugInfo(info) {
            console.log('Debug Info:', info);
            const debugDiv = document.createElement('div');
            debugDiv.className = 'debug-info';
            debugDiv.textContent = JSON.stringify(info, null, 2);
            
            const quizList = document.getElementById('quiz-list');
            if (quizList && !quizList.querySelector('.debug-info')) {
                quizList.appendChild(debugDiv);
            }
        }

        // Función para mostrar una página específica
        function showPage(pageId, area = 'contabilidad') {
            if (pageId === 'menu-page') {
                currentArea = area;
                document.getElementById('area-title').textContent = 
                    area === 'contabilidad' ? 'Contabilidad' :
                    area === 'analisis-economico-financiero' ? 'Análisis Económico-Financiero' :
                    area === 'economia' ? 'Economía' : 'Marketing';
                
                // Mostrar mensaje de carga
                const quizList = document.getElementById('quiz-list');
                quizList.innerHTML = '<div class="loading">Cargando temas...</div>';
                
                // Cargar temas de esta área
                loadAreaThemes();
            }
            
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // Carga los temas de un área
        function loadAreaThemes() {
            const quizList = document.getElementById('quiz-list');
            const basePath = getBasePath();
            
            showDebugInfo({
                currentArea,
                basePath,
                currentUrl: window.location.href,
                pathname: window.location.pathname
            });
            
            // Lista de archivos JSON conocidos para cada área
            const knownFiles = {
                'contabilidad': ['contabilidad-basica.json', 'inversion-no-corriente.json'],
                'analisis-economico-financiero': ['introduccion.json'],
                'economia': ['introduccion.json'],
                'marketing': ['introduccion.json']
            };
            
            const filesToCheck = knownFiles[currentArea] || [];
            const validThemes = [];
            let checkedFiles = 0;
            
            if (filesToCheck.length === 0) {
                quizList.innerHTML = '<div class="error">No hay temas configurados para esta área.</div>';
                return;
            }
            
            filesToCheck.forEach(file => {
                const url = `${basePath}/content/${currentArea}/${file}`;
                
                fetch(url)
                    .then(response => {
                        checkedFiles++;
                        if (response.ok) {
                            return response.json();
                        }
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    })
                    .then(data => {
                        validThemes.push({
                            id: file.replace('.json', ''),
                            title: data.title || 'Título no disponible',
                            file: file
                        });
                        
                        // Si hemos revisado todos los archivos, mostrar resultados
                        if (checkedFiles === filesToCheck.length) {
                            displayThemes(validThemes);
                        }
                    })
                    .catch(error => {
                        console.error(`Error loading ${file}:`, error);
                        
                        // Si hemos revisado todos los archivos, mostrar resultados
                        if (checkedFiles === filesToCheck.length) {
                            displayThemes(validThemes);
                        }
                    });
            });
        }

        // Muestra los temas válidos encontrados
        function displayThemes(themes) {
            const quizList = document.getElementById('quiz-list');
            
            if (themes.length === 0) {
                quizList.innerHTML = `
                    <div class="error">
                        <h3>No se encontraron temas</h3>
                        <p>No se pudieron cargar los archivos JSON para el área "${currentArea}".</p>
                        <p>Verifica que los siguientes archivos existen y son accesibles:</p>
                        <ul>
                            <li>content/${currentArea}/contabilidad-basica.json</li>
                            <li>content/${currentArea}/inversion-no-corriente.json</li>
                        </ul>
                        <p>URL base detectada: <code>${getBasePath()}</code></p>
                    </div>
                `;
                return;
            }
            
            quizList.innerHTML = '';
            themes.forEach(theme => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = theme.title;
                btn.onclick = () => loadQuiz(theme.id);
                quizList.appendChild(btn);
            });
        }

        // Carga un quiz específico desde JSON
        function loadQuiz(quizId) {
            currentQuizId = quizId;
            const basePath = getBasePath();
            const url = `${basePath}/content/${currentArea}/${quizId}.json`;
            
            // Mostrar mensaje de carga
            const content = document.getElementById('quiz-content');
            content.innerHTML = '<div class="loading">Cargando tema...</div>';
            
            showDebugInfo({
                action: 'loadQuiz',
                quizId,
                url,
                basePath
            });
            
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    quizData = data;
                    totalQuestions = quizData.questions.length;
                    document.getElementById('total-questions').textContent = totalQuestions;
                    currentQuestionIndex = 0;
                    score = 0;
                    selectedOptions = [];
                    
                    // Actualizar título
                    document.getElementById('quiz-title').textContent = quizData.title;
                    
                    // Cargar la primera pregunta
                    loadQuestion();
                    showPage('quiz-page');
                })
                .catch(error => {
                    console.error('Error loading quiz:', error);
                    content.innerHTML = `
                        <div class="error">
                            <h3>¡Error al cargar el tema!</h3>
                            <p><strong>URL intentada:</strong> <code>${url}</code></p>
                            <p><strong>Error:</strong> ${error.message}</p>
                            <p>Posibles soluciones:</p>
                            <ul>
                                <li>Verifica que el archivo JSON existe en el repositorio</li>
                                <li>Comprueba que el archivo tiene formato JSON válido</li>
                                <li>Asegúrate de que GitHub Pages está habilitado</li>
                                <li>Espera unos minutos para que GitHub Pages se actualice</li>
                            </ul>
                        </div>
                    `;
                });
        }

        // Carga una pregunta específica
        function loadQuestion() {
            const question = quizData.questions[currentQuestionIndex];
            const content = document.getElementById('quiz-content');
            document.getElementById('current-question').textContent = currentQuestionIndex + 1;
            selectedOptions = []; // Reset selections for new question
            
            content.innerHTML = `
                <div class="question">
                    ${question.intro ? `<div class="question-intro"><p>${question.intro}</p></div>` : ''}
                    <div class="question-text">${question.question}</div>
                    <div class="options" id="options-${currentQuestionIndex}">
                        ${question.options.map((opt, i) => `
                            <div class="option" onclick="toggleSelect(this, ${i})">${opt}</div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback-${currentQuestionIndex}" style="display:none;"></div>
                    <div class="question-actions">
                        <button class="btn-validate" id="validate-btn" onclick="validateAnswer()">Validar respuesta</button>
                        <button class="btn-saber-mas" onclick="openModal()">Saber más</button>
                    </div>
                </div>
            `;
        }

        // Permite seleccionar opciones
        function toggleSelect(element, optionIndex) {
            const options = document.querySelectorAll(`#options-${currentQuestionIndex} .option`);
            const question = quizData.questions[currentQuestionIndex];
            
            // Si es pregunta de única respuesta, deseleccionar otras
            if (question.correct.length === 1) {
                options.forEach(opt => opt.classList.remove('selected'));
                element.classList.add('selected');
                selectedOptions = [optionIndex];
            } 
            // Si es pregunta de múltiple respuesta
            else {
                if (element.classList.contains('selected')) {
                    element.classList.remove('selected');
                    selectedOptions = selectedOptions.filter(i => i !== optionIndex);
                } else {
                    element.classList.add('selected');
                    selectedOptions.push(optionIndex);
                }
            }
        }

        // Valida la respuesta
        function validateAnswer() {
            if (selectedOptions.length === 0) {
                alert('Por favor, selecciona al menos una opción.');
                return;
            }
            
            const question = quizData.questions[currentQuestionIndex];
            const feedback = document.getElementById(`feedback-${currentQuestionIndex}`);
            const validateBtn = document.getElementById('validate-btn');
            const options = document.querySelectorAll(`#options-${currentQuestionIndex} .option`);
            
            // Deshabilitar botón y opciones
            validateBtn.disabled = true;
            options.forEach(opt => opt.style.pointerEvents = 'none');
            
            // Verificar respuestas
            const correctAnswers = [...question.correct].sort();
            const userAnswers = [...selectedOptions].sort();
            const isCorrect = JSON.stringify(correctAnswers) === JSON.stringify(userAnswers);
            
            // Mostrar feedback
            if (isCorrect) {
                feedback.className = 'feedback correct';
                feedback.innerHTML = '¡Correcto! La respuesta es correcta.';
                score++;
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = 'Incorrecto. Revisa las opciones seleccionadas.';
            }
            
            feedback.style.display = 'block';
            
            // Resaltar respuestas correctas e incorrectas
            options.forEach((opt, i) => {
                if (question.correct.includes(i)) {
                    opt.classList.add('correct');
                }
                if (selectedOptions.includes(i) && !question.correct.includes(i)) {
                    opt.classList.add('incorrect');
                }
            });
            
            // Cambiar botón a "Siguiente"
            setTimeout(() => {
                if (currentQuestionIndex < totalQuestions - 1) {
                    validateBtn.textContent = 'Siguiente pregunta';
                    validateBtn.onclick = nextQuestion;
                } else {
                    validateBtn.textContent = 'Ver resultados';
                    validateBtn.onclick = showResults;
                }
                validateBtn.disabled = false;
            }, 1500);
        }

        // Muestra la siguiente pregunta
        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        // Muestra los resultados
        function showResults() {
            document.getElementById('final-score').textContent = `${score}/${totalQuestions}`;
            
            // Mensaje según puntuación
            const resultMessage = document.getElementById('result-message');
            const percentage = (score / totalQuestions) * 100;
            
            if (percentage === 100) {
                resultMessage.textContent = '¡Excelente! Has respondido todas las preguntas correctamente.';
            } else if (percentage >= 75) {
                resultMessage.textContent = '¡Buen trabajo! Tienes un buen conocimiento del tema.';
            } else if (percentage >= 50) {
                resultMessage.textContent = 'Buen esfuerzo. Revisa las preguntas que has fallado para mejorar.';
            } else {
                resultMessage.textContent = 'Necesitas repasar más el tema. ¡No te rindas!';
            }
            
            showPage('results-page');
        }

        // Abre el modal de "Saber más"
        function openModal() {
            const question = quizData.questions[currentQuestionIndex];
            const modal = document.getElementById('saberMasModal');
            const modalContent = document.getElementById('modal-content');
            
            modalContent.innerHTML = question.saber_mas;
            modal.style.display = 'flex';
        }

        // Cierra el modal
        function closeModal() {
            document.getElementById('saberMasModal').style.display = 'none';
        }

        // Inicialización al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            // Configurar evento para cerrar el modal al hacer clic fuera
            window.onclick = function(event) {
                const modal = document.getElementById('saberMasModal');
                if (event.target === modal) closeModal();
            };
            
            // Configurar tecla ESC para cerrar el modal
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    closeModal();
                }
            });
            
            // Si hay un hash en la URL, cargar esa área directamente
            if (window.location.hash) {
                const area = window.location.hash.substring(1);
                if (['contabilidad', 'analisis-economico-financiero', 'economia', 'marketing'].includes(area)) {
                    showPage('menu-page', area);
                }
            }
        });
    </script>
</body>
</html>
